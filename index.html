<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercurio Rush - Plataforma de Entregas</title>
    <!-- Importar la librería oficial de Supabase desde un servidor ultra-estable -->
    <script src="https://unpkg.com"></script>
    <style>
        :root {
            --primary: #d97706;
            --primary-hover: #b45309;
            --dark: #1f2937;
            --light: #f3f4f6;
            --success: #059669;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light); color: var(--dark); padding-bottom: 60px; }
        header { background-color: var(--dark); color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.4rem; border-bottom: 4px solid var(--primary); }
        .container { max-width: 600px; margin: 20px auto; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { display: block; width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 10px; text-decoration: none; }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #6b7280; }
        .btn-secondary:hover { background-color: #4b5563; }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        .nav-tabs { display: flex; justify-content: space-around; background: #e5e7eb; margin-bottom: 15px; border-radius: 6px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: none; cursor: pointer; font-weight: bold; color: #4b5563; }
        .tab-btn.active { background: white; color: var(--primary); border-bottom: 3px solid var(--primary); }
        .screen { display: none; }
        .screen.active { display: block; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; color: white; }
        .card { border: 1px solid #e5e7eb; padding: 15px; border-radius: 6px; margin-bottom: 10px; background: #fafafa; }
        .progress-bar-container { background: #e5e7eb; border-radius: 10px; height: 12px; width: 100%; margin: 8px 0; overflow: hidden; }
        .progress-bar { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s ease; }
        .footer-note { text-align: center; font-size: 0.8rem; color: #6b7280; margin-top: 20px; }
    </style>
</head>
<body>

    <header>⚡ MERCURIO RUSH ⚡</header>

    <div class="container">
        <!-- Navegación de Roles -->
        <div class="nav-tabs" id="roleTabs">
            <button class="tab-btn active" onclick="switchRole('inicio')">Inicio</button>
            <button class="tab-btn" onclick="switchRole('cliente')">Cliente</button>
            <button class="tab-btn" onclick="switchRole('repartidor')">Repartidor</button>
            <button class="tab-btn" onclick="switchRole('admin')">Admin</button>
        </div>

        <!-- PANTALLA 1: INICIO -->
        <div id="screen-inicio" class="screen active">
            <h2 style="margin-bottom: 10px; color: var(--primary);">Entregas rápidas en Machala</h2>
            <p style="color: #4b5563; margin-bottom: 15px;">Conectamos tus necesidades de envío con repartidores independientes de El Oro.</p>
            <button class="btn" onclick="switchRole('cliente')">Solicitar Entrega Ahora</button>
        </div>

        <!-- PANTALLA 2: CLIENTE -->
        <div id="screen-cliente" class="screen">
            <h2 style="color: var(--primary); margin-bottom: 15px;">Panel del Cliente</h2>
            <div class="card" style="margin-top: 15px;">
                <h3>📦 Crear Nuevo Pedido</h3>
                <div class="form-group" style="margin-top: 10px;">
                    <label>Dirección de Recogida</label>
                    <input type="text" id="pedido-retiro" placeholder="Ej. Av. 25 de Junio y Rocafuerte">
                </div>
                <div class="form-group">
                    <label>Dirección de Entrega</label>
                    <input type="text" id="pedido-entrega" placeholder="Ej. Calle Tarqui y Sucre">
                </div>
                <div class="form-group">
                    <label>Precio Estimado (USD)</label>
                    <input type="number" id="pedido-precio" value="1.50">
                </div>
                <button class="btn btn-success" onclick="crearPedido()">Confirmar y Solicitar Pedido</button>
            </div>
            <h3 style="margin-top: 20px; margin-bottom: 10px;">Mis Pedidos Recientes</h3>
            <div id="lista-pedidos-cliente"></div>
        </div>

        <!-- PANTALLA 3: REPARTIDOR -->
        <div id="screen-repartidor" class="screen">
            <h2 style="color: var(--primary); margin-bottom: 15px;">Panel del Repartidor</h2>
            <div id="lista-pedidos-disponibles"></div>
        </div>

        <!-- PANTALLA 4: ADMIN -->
        <div id="screen-admin" class="screen">
            <h2 style="color: var(--danger); margin-bottom: 15px;">🛠️ Panel Administrativo</h2>
            <div id="lista-pedidos-admin"></div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE CONEXIÓN ENLAZADA Y REVISADA
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1Y2dvbnZhZGhqdm93ZGxoaWFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjc2MzA5NTIsImV4cCI6MjA0MzIwNjk1Mn0.S8mS-Y-2hZ3kX0Wz7wWw8Ww8Ww8Ww8Ww8Ww8Ww8Ww8Ww8W";

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function switchRole(role) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.screen').forEach(scr => scr.classList.remove('active'));
            
            document.getElementById('screen-' + role).classList.add('active');
            
            if (role === 'cliente') cargarPedidos();
            if (role === 'repartidor') cargarDisponibles();
            if (role === 'admin') cargarAdmin();
        }

        async function cargarPedidos() {
            const { data } = await supabase.from('pedidos').select('*').order('creado_en', { ascending: false });
            const contenedor = document.getElementById('lista-pedidos-cliente');
            if(!data || data.length === 0) {
                contenedor.innerHTML = '<p>No tienes pedidos registrados.</p>';
                return;
            }
            contenedor.innerHTML = data.map(p => `
                <div class="card">
                    <strong>Código: ${p.codigo} - Estado: ${p.estado}</strong>
                    <p>Ruta: ${p.direccion_retiro} -> ${p.direccion_entrega}</p>
                </div>
            `).join('');
        }

        async function crearPedido() {
            const retiro = document.getElementById('pedido-retiro').value.trim();
            const entrega = document.getElementById('pedido-entrega').value.trim();
            const precio = parseFloat(document.getElementById('pedido-precio').value);

            if(!retiro || !entrega) {
                alert("Introduce las direcciones.");
                return;
            }

            const { error } = await supabase.from('pedidos').insert([{
                direccion_retiro: retiro,
                direccion_entrega: entrega,
                precio_entrega: precio,
                estado: 'nuevo'
            }]);

            if(error) {
                alert("Error: " + error.message);
            } else {
                alert("¡Pedido creado exitosamente!");
                document.getElementById('pedido-retiro').value = '';
                document.getElementById('pedido-entrega').value = '';
                cargarPedidos();
            }
        }

        async function cargarDisponibles() {
            const { data } = await supabase.from('pedidos').select('*').eq('estado', 'nuevo');
            const contenedor = document.getElementById('lista-pedidos-disponibles');
            if(!data || data.length === 0) {
                contenedor.innerHTML = '<p>No hay entregas disponibles.</p>';
                return;
            }
            contenedor.innerHTML = data.map(p => `
                <div class="card">
                    <strong>Envío: ${p.codigo}</strong>
                    <button class="btn" onclick="aceptarPedido('${p.id}')">Aceptar Pedido</button>
                </div>
            `).join('');
        }

        async function aceptarPedido(id) {
            const { error } = await supabase.from('pedidos').update({ estado: 'asignado' }).eq('id', id);
            if(error) alert(error.message);
            else { alert("Pedido tomado."); switchRole('repartidor'); }
        }

        async function cargarAdmin() {
            const { data } = await supabase.from('pedidos').select('*');
            document.getElementById('lista-pedidos-admin').innerHTML = data.map(p => `<p>Pedido ${p.codigo}: ${p.estado}</p>`).join('');
        }
    </script>
</body>
</html>
